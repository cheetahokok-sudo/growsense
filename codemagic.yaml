# Codemagic CI/CD — GrowSense iOS (Flutter, app lives in flutter_app/).
#
# ONE-TIME SETUP in the Codemagic UI before the first build:
#   1. Connect this GitHub repo.
#   2. Team settings → Integrations → App Store Connect: add an API key
#      (Issuer ID + Key ID + the .p8). Name it to match `integrations` below.
#   3. Create the app in App Store Connect first (bundle id
#      com.growsense.growsense), then put its numeric Apple ID in APP_ID.
#   4. Apple Developer Program enrollment must be active (nothing signs without it).
#
# This workflow builds a signed IPA and ships it to TestFlight. It does NOT
# auto-submit to App Store review — promote from TestFlight when ready.

workflows:
  ios-appstore:
    name: GrowSense iOS — TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: flutter_app
    integrations:
      app_store_connect: GrowSense ASC Key   # ← must match the API key name in Codemagic
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      # NOTE: no declarative `ios_signing:` block here on purpose. That block makes
      # Codemagic look for an ALREADY-EXISTING provisioning profile and fails on a
      # fresh account ("No matching profiles found ... app_store"). Instead the
      # "Set up code signing" script below runs `fetch-signing-files --create`,
      # which creates the distribution certificate AND profile from scratch,
      # authenticating via the `GrowSense ASC Key` integration.
      groups:
        - appstore          # Codemagic env-var group; must contain the SECURE var
                            # CERTIFICATE_PRIVATE_KEY (the PEM private key used to
                            # create/reuse the iOS distribution certificate).
      vars:
        BUNDLE_ID: "com.growsense.growsense"
        APP_STORE_APPLE_ID: 6790710624        # numeric Apple ID for "GrowSense Life" (com.growsense.growsense)
    scripts:
      - name: Set up code signing (automatic, via ASC API key)
        script: |
          keychain initialize
          # --certificate-key gives fetch-signing-files a persistent private key so
          # it CREATES the iOS distribution certificate on the first run (there were
          # zero certs on the account) and reuses it on every later build. Without a
          # key it only makes profiles, so the archive had no certificate to sign with.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key @env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Flutter dependencies
        script: flutter pub get
      - name: CocoaPods install
        script: find . -name "Podfile" -execdir pod install \;
      - name: Flutter build IPA (auto-bump build number)
        script: |
          # NOTE: each Codemagic script step runs in its own shell, so the
          # build-number lookup and the build must live in the SAME step —
          # otherwise BUILD_NUMBER is empty at build time and every build is #1
          # (TestFlight rejects duplicate build numbers).
          BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          NEXT=$(($BUILD_NUMBER + 1))
          echo "Next build number: $NEXT"
          flutter build ipa --release \
            --build-number=$NEXT \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # submit_to_app_store: false   # flip to true only for a real release
